<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo blanco -->
  <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">

    <!-- ============ CARA (rubber-hose) ============ -->
    <!-- Cabeza -->
    <path d="M 96 232 a 78 78 0 1 1 156 0 a 78 78 0 1 1 -156 0" fill="#ffffff" stroke-width="14"/>

    <!-- Cabello oscuro peinado hacia un lado -->
    <path d="M 100 190
             C 108 128 176 116 214 146
             C 232 160 236 176 232 190
             C 214 168 186 162 168 176
             C 150 190 128 196 100 190 Z"
          fill="#000000" stroke-width="12"/>
    <!-- Mechón swooping -->
    <path d="M 214 146 C 236 138 252 144 258 158" stroke-width="10"/>

    <!-- Lentes redondos -->
    <circle cx="128" cy="226" r="24" fill="#ffffff" stroke-width="12"/>
    <circle cx="220" cy="226" r="24" fill="#ffffff" stroke-width="12"/>
    <path d="M 152 226 Q 174 216 196 226" stroke-width="10"/>
    <!-- Patillas de los lentes -->
    <path d="M 104 226 L 96 230" stroke-width="10"/>
    <path d="M 244 226 L 252 230" stroke-width="10"/>

    <!-- Ojos dentro de los lentes -->
    <circle cx="132" cy="226" r="5" fill="#000000" stroke="none"/>
    <circle cx="216" cy="226" r="5" fill="#000000" stroke="none"/>

    <!-- Sonrisa grande -->
    <path d="M 120 266 Q 174 312 228 266" stroke-width="12"/>
    <!-- Hoyuelos -->
    <path d="M 110 258 q -8 8 -2 16" stroke-width="8"/>
    <path d="M 238 258 q 8 8 2 16" stroke-width="8"/>

    <!-- Mejillas con líneas de rubor estilo cartoon -->
    <path d="M 108 252 q 8 6 0 12" stroke-width="7"/>
    <path d="M 240 252 q -8 6 0 12" stroke-width="7"/>

    <!-- Cuello simple -->
    <path d="M 158 310 L 154 330 M 190 310 L 194 330" stroke-width="10"/>

    <!-- ============ IMPRESORA 3D FDM ============ -->
    <!-- Cuerpo: caja cerrada con frente abierto -->
    <path d="M 300 196 L 468 196 L 468 396 L 300 396 Z" fill="#ffffff" stroke-width="14"/>
    <!-- Frente abierto -->
    <path d="M 318 224 L 450 224 L 450 368 L 318 368 Z" fill="#ffffff" stroke-width="10"/>

    <!-- Bobina de filamento arriba -->
    <circle cx="332" cy="160" r="34" fill="#ffffff" stroke-width="12"/>
    <circle cx="332" cy="160" r="9" fill="#ffffff" stroke-width="9"/>
    <!-- Filamento de la bobina hacia dentro de la caja -->
    <path d="M 332 194 C 330 214 344 218 356 226" stroke-width="7"/>

    <!-- Gantry superior -->
    <path d="M 318 236 L 450 236" stroke-width="10"/>
    <!-- Cabezal extrusor -->
    <path d="M 376 236 L 376 262 L 368 262 L 372 274 L 384 274 L 388 262 L 380 262 Z" fill="#ffffff" stroke-width="9"/>
    <!-- Boquilla -->
    <path d="M 378 274 L 378 286" stroke-width="9"/>
    <!-- Línea de impresión extruyendo -->
    <path d="M 378 286 L 378 296" stroke-width="6"/>

    <!-- Cama de impresión -->
    <path d="M 330 330 L 438 330 L 438 344 L 330 344 Z" fill="#ffffff" stroke-width="10"/>
    <!-- Objeto pequeño imprimiéndose (capas) -->
    <path d="M 356 330 L 400 330 L 400 312 L 356 312 Z" fill="#ffffff" stroke-width="9"/>
    <path d="M 360 312 L 396 312" stroke-width="6"/>
    <!-- Patas -->
    <path d="M 316 396 L 316 410 M 452 396 L 452 410" stroke-width="10"/>

    <!-- ============ DESTELLOS Y LÍNEAS DE MOVIMIENTO ============ -->
    <!-- Destello grande arriba derecha -->
    <path d="M 468 128 L 476 116 L 484 128 L 476 140 Z" fill="#ffffff" stroke-width="8"/>
    <path d="M 470 136 l 12 12" stroke-width="6"/>
    <!-- Destello pequeño izquierda arriba -->
    <path d="M 268 120 L 274 110 L 280 120 L 274 130 Z" fill="#ffffff" stroke-width="7"/>
    <!-- Destello pequeño derecha abajo -->
    <path d="M 486 320 L 492 310 L 498 320 L 492 330 Z" fill="#ffffff" stroke-width="7"/>
    <!-- Líneas de movimiento alrededor de la impresora -->
    <path d="M 484 200 q 14 10 12 26" stroke-width="8"/>
    <path d="M 496 246 q 8 14 2 28" stroke-width="7"/>
    <path d="M 282 420 q -14 -6 -20 -18" stroke-width="8"/>

    <!-- Líneas de movimiento junto a la cara (energía) -->
    <path d="M 62 148 q -12 10 -10 26" stroke-width="8"/>
    <path d="M 48 196 q -8 14 -2 28" stroke-width="7"/>

  </g>
</svg>
